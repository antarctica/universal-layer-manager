name: Deploy Documentation and Examples to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Build documentation
        run: npm run docs:build

      - name: Build simple example
        working-directory: ./examples/simple
        env:
          VITE_BASE_PATH: /universal-layer-manager/examples/simple/
        run: npm run build

      - name: Build leaflet example
        working-directory: ./examples/leaflet
        env:
          VITE_BASE_PATH: /universal-layer-manager/examples/leaflet/
        run: npm run build

      - name: Build leaflet XState example
        working-directory: ./examples/leaflet-xstate
        env:
          VITE_BASE_PATH: /universal-layer-manager/examples/leaflet-xstate/
        run: npm run build

      - name: Build maplibre example
        working-directory: ./examples/maplibre
        env:
          VITE_BASE_PATH: /universal-layer-manager/examples/maplibre/
        run: npm run build

      - name: Build arcgis example
        working-directory: ./examples/arcgis
        env:
          VITE_BASE_PATH: /universal-layer-manager/examples/arcgis/
        run: npm run build

      - name: Build openlayers example
        working-directory: ./examples/openlayers
        env:
          VITE_BASE_PATH: /universal-layer-manager/examples/openlayers/
        run: npm run build

      - name: Prepare GitHub Pages structure
        run: |
          mkdir -p gh-pages
          # Copy the documentation site to root
          cp -r docs/.vitepress/dist/* gh-pages/
          # Copy examples to subdirectories
          mkdir -p gh-pages/examples/simple
          cp -r examples/simple/dist/* gh-pages/examples/simple/
          mkdir -p gh-pages/examples/leaflet
          cp -r examples/leaflet/dist/* gh-pages/examples/leaflet/
          mkdir -p gh-pages/examples/leaflet-xstate
          cp -r examples/leaflet-xstate/dist/* gh-pages/examples/leaflet-xstate/
          mkdir -p gh-pages/examples/maplibre
          cp -r examples/maplibre/dist/* gh-pages/examples/maplibre/
          mkdir -p gh-pages/examples/arcgis
          cp -r examples/arcgis/dist/* gh-pages/examples/arcgis/
          mkdir -p gh-pages/examples/openlayers
          cp -r examples/openlayers/dist/* gh-pages/examples/openlayers/

      - name: Verify build output
        run: |
          if [ ! -d "gh-pages" ]; then
            echo "Error: gh-pages directory not found"
            exit 1
          fi
          if [ ! -f "gh-pages/index.html" ]; then
            echo "Error: gh-pages/index.html (documentation) not found"
            exit 1
          fi
          if [ ! -f "gh-pages/examples/simple/index.html" ]; then
            echo "Error: simple example not found"
            exit 1
          fi
          if [ ! -f "gh-pages/examples/leaflet/index.html" ]; then
            echo "Error: leaflet example not found"
            exit 1
          fi
          if [ ! -f "gh-pages/examples/leaflet-xstate/index.html" ]; then
            echo "Error: leaflet XState example not found"
            exit 1
          fi
          if [ ! -f "gh-pages/examples/maplibre/index.html" ]; then
            echo "Error: maplibre example not found"
            exit 1
          fi
          if [ ! -f "gh-pages/examples/arcgis/index.html" ]; then
            echo "Error: arcgis example not found"
            exit 1
          fi
          if [ ! -f "gh-pages/examples/openlayers/index.html" ]; then
            echo "Error: openlayers example not found"
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./gh-pages

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

